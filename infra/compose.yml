name: tomo

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  api:
    build: ..
    image: tomo-api:${VERSION:-dev}
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      PORT: 8666
    env_file: ../../.env
    volumes:
      - /data/tomo:/data/tomo
    expose:
      - "8666"

volumes:
  caddy_data:
  caddy_config:
